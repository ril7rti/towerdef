<!-- index.html -->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini Tower Defense</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="wrap">
    <header class="bar">
      <div class="stats">
        <span>❤️ <b id="lives">10</b></span>
        <span>🪙 <b id="gold">100</b></span>
        <span>🌊 <b id="wave">0</b></span>
        <span>🛡️ タワー: <b id="towerCost">50</b></span>
      </div>
      <div class="actions">
        <button id="startWave">次のウェーブ開始</button>
        <button id="restart">リスタート</button>
      </div>
    </header>

    <main class="stage">
      <canvas id="game" width="900" height="520"></canvas>
      <div class="hint">
        クリックでタワー配置（道の上は置けません）。タワーは自動で射撃します。
      </div>
    </main>
  </div>

<!-- index.html（script行だけ変更） -->
<script type="module" src="./js/main.js"></script>

</body>
</html>
